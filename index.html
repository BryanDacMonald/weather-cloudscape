  cam.pos[1] = Math.min(40, Math.max(cam.pos[1], groundAt(cam.pos[0], cam.pos[2]) + 0.02));
  const eye = ov ? ov.pos : imageMode ? [HOME_POS[0], 0.25 - (HOME_POS[0] ** 2 + HOME_POS[2] ** 2) / (2 * RG), HOME_POS[2]] : cam.pos;
  const fov = fovDeg * Math.PI / 180, aspect = S.W / S.H;
  const view = viewFromBasis(eye, rt, up, fw), proj = perspective(fov, aspect, 0.004, 800);
  const VP = mat4mul(proj, view);
  if (!prevVP) prevVP = VP;
  if (!prevEye) prevEye = eye.slice();

  // ---- sun-space shadow projection, centred on the camera and snapped to whole texels ----
  const EXT = 45, ZR = 150, SNAP = 2 * EXT / 256;         // 256 divides every shadow-map size used
  const shC = [Math.round(v3.dot(eye, sR) / SNAP) * SNAP, Math.round(v3.dot(eye, sU) / SNAP) * SNAP];
  const shZ = Math.round(v3.dot(eye, L) / 5) * 5;            // depth centre, snapped so the cached map stays valid
  // terrain shadow cascades: same sun basis / depth range, smaller extents near the camera, each snapped to its own texels
  const cascMat = new Float32Array(16 * CASC_EXT.length), cascC = [];
  CASC_EXT.forEach((E, c) => {
    const sn = 2 * E / 256;
    const cc = [Math.round(v3.dot(eye, sR) / sn) * sn, Math.round(v3.dot(eye, sU) / sn) * sn];
    cascC.push(cc);
    cascMat.set([sR[0]/E, sU[0]/E, -L[0]/ZR, 0, sR[1]/E, sU[1]/E, -L[1]/ZR, 0,
                 sR[2]/E, sU[2]/E, -L[2]/ZR, 0, -cc[0]/E, -cc[1]/E, shZ/ZR, 1], c * 16);
  });
  const fmC = [Math.round(eye[0] / FM_SNAP) * FM_SNAP, Math.round(eye[2] / FM_SNAP) * FM_SNAP];
  const GRID_SNAP = 0.5;
  const gridOrigin = [Math.round(eye[0] / GRID_SNAP) * GRID_SNAP, Math.round(eye[2] / GRID_SNAP) * GRID_SNAP];

  // ---- trees: cell size and instance grid (shared by the shadow cascades and the main draw) ----
  const treeCS = 0.028 / Math.sqrt(P.treedens), treeN = Math.ceil(2 * P.treedist / treeCS) + 2;
  const treesInShadow = P.trees && P.treeshadow > 0 && P.forest > 0;

  const hazeQ = Math.round(P.haze * 20) / 20;   // quantised: the atmosphere LUTs are rebuilt when it changes
  // ---- real night sky (stars, planets, Moon) ----
  Object.assign(G, Sky.update(L, 2 * Math.tan(fov / 2) / S.H));
  // ---- globals ----
  Object.assign(G, {
    uSunDir: L, uSunIllum: [10, 9.8, 9.4], uHaze: hazeQ,
    uTransLUT: R.trans, uMSLUT: R.ms, uIrr: R.irr,
    uShapeTex: R.shape, uDetailTex: R.detail, uWeatherTex: R.weather, uCurlTex: R.curl, uTurb: P.turb,
    uShapeScale: P.shapeSize, uMidScale: P.midSize, uFineScale: P.fineSize, uMidAmt: P.midAmt, uFineAmt: P.fineAmt,
    uOctW: octW(P.rough), uSunBright: P.sunb, uSunRadius: P.sunsize * 0.5 * Math.PI / 180,
    uCloudBottom: P.cbottom, uCloudTop: P.cbottom + P.cthick, uCoverage: P.coverage, uCloudType: P.ctype,
    uCloudDensity: P.density, uErosion: P.erosion, uWind: windOff, uWindDir: wdir,
    uCloudShadow: R.cshadow, uTerrainShadow: R.tshadow, uCascMat: cascMat, uCascTexel: CASC_EXT.map(E => 2 * E / 2048), uSunRight: sR, uSunUp: sU,
    uShadowExtent: EXT, uSunZRange: ZR, uShadowCenter: shC, uGridOrigin: gridOrigin,
    uTerrainType: P.terrain === 'Rolling hills' ? 1 : 0, uForestDens: P.forest, uTreeLine: P.treeline, uTreeFar: P.trees ? P.treedist : 1e-4,   // trees off: no tree shadows/AO, canopy shading everywhere
   
    uForestMap: R.fmap, uFMCenter: fmC, uFMExtent: FM_EXT, uTime: now / 1000, uSway: P.sway, uLump: P.lumps, uTreeSize: P.treesize,
    uTreeCS: treeCS, uHeightVar: P.heightvar, uTreeAO: P.treeao, uDryAmt: P.dryamt, uPaths: P.paths, uTreeShadow: treesInShadow ? P.treeshadow : 0,
    uFoliageTex: R.foliage, uColorVar: P.colorvar, uCutout: P.cutout, uLeafNrm: P.leafnrm, uCutDist: P.cutdist, uTreeGrad: P.treegrad,
    uCamPos: eye, uCamFwd: fw, uCamRight: rt, uCamUp: up, uTanHalf: [Math.tan(fov/2) * aspect, Math.tan(fov/2)],
  });

  gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND);
  if (noiseDirty){ bakeNoise(); noiseDirty = false; resetHistory = true; }

  // ---- atmosphere LUTs (only when the medium changes) ----
  const ak = hazeQ.toFixed(3);
  if (ak !== atmoKey){ fullscreen(PR.trans, R.transFB, 256, 64); fullscreen(PR.ms, R.msFB, 32, 32); atmoKey = ak; }
  fullscreen(PR.irr, R.irrFB, 2, 1);


  // ---- forest map (when the camera crosses a 0.5 km snap, or terrain/forest settings change) ----
  if (imageMode){
    // no terrain in image mode: clear the cascades once so the atmosphere sees no mountain shadows
    if (!S.cascCleared){
      for (const fb of R.tshadowFB){ gl.bindFramebuffer(gl.FRAMEBUFFER, fb); gl.clearBufferfv(gl.DEPTH, 0, [1]); }
      lastSunKey = ['', '', '']; S.cascCleared = true;
    }
  } else S.cascCleared = false;
  const fk = fmC.join() + P.terrain + P.forest + P.treeline;
  if (!imageMode && fk !== fmapKey){ fullscreen(PR.fmap, R.fmapFB, FM_SIZE, FM_SIZE, {uFMSize: FM_SIZE}); fmapKey = fk; }
  // ---- terrain shadow cascades: each re-rendered only when the sun moves or its snapped centre changes ----
  // Trees go into cascades 0 and 1 (3 km and 12 km wide, covering the tree draw distance). Sway is left out of
  // the shadows (uSway 0) because the cascades are cached between frames.
  const treeKey = treesInShadow ? [fmapKey, P.treedens, P.treesize, P.treedist, P.heightvar, P.lumps, P.cutout, P.cutdist].join() : 'off';
  const skBase = L.map(x => x.toFixed(5)).join() + gridOrigin.join() + shZ + P.terrain;
  if (!imageMode) CASC_EXT.forEach((E, c) => {
    const drawTrees = treesInShadow && c < 2;
    const sk = skBase + cascC[c].join() + (c < 2 ? treeKey : '');
    if (sk === lastSunKey[c]) return;
    const cascVP = cascMat.subarray(c * 16, c * 16 + 16);
    gl.bindFramebuffer(gl.FRAMEBUFFER, R.tshadowFB[c]); gl.viewport(0, 0, 2048, 2048);
    gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LESS); gl.clearBufferfv(gl.DEPTH, 0, [1]);
    gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(1.5, 3);
    use(PR.tshadow, {uViewProj: cascVP, uOct: c < 2 ? 9 : 8});
    gl.bindVertexArray(R.terrainVAO); gl.drawElements(gl.TRIANGLES, R.terrainCount, gl.UNSIGNED_INT, 0);
    if (c < 2){
      // keep a terrain-only copy of this cascade (layer c + 3) before the trees go in
      gl.bindFramebuffer(gl.READ_FRAMEBUFFER, R.tshadowFB[c]); gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, R.tshadowFB[c + 3]);
      gl.blitFramebuffer(0, 0, 2048, 2048, 0, 0, 2048, 2048, gl.DEPTH_BUFFER_BIT, gl.NEAREST);
      gl.bindFramebuffer(gl.FRAMEBUFFER, R.tshadowFB[c]);
    }
    if (drawTrees){
      // both faces: the far side of the crown must still cast a shadow where the near side has a cutout hole
      use(PR.treeshadow, {uViewProj: cascVP, uN: treeN, uBase: [Math.floor(eye[0] / treeCS), Math.floor(eye[2] / treeCS)],
                          uRows: R.treeMid.rows, uSegs: R.treeMid.seg, uSway: 0});
      gl.bindVertexArray(R.treeMid.vao);
      gl.drawElementsInstanced(gl.TRIANGLES, R.treeMid.count, gl.UNSIGNED_SHORT, 0, treeN * treeN);
    }
    gl.disable(gl.POLYGON_OFFSET_FILL); gl.disable(gl.DEPTH_TEST);
    lastSunKey[c] = sk;
  });

  // ---- cloud shadow map ----
  fullscreen(PR.cshadow, R.cshadowFB, S.cshadowSize, S.cshadowSize, {uSize: [S.cshadowSize, S.cshadowSize]});

  // ---- terrain ----
  gl.bindFramebuffer(gl.FRAMEBUFFER, R.terrainFB); gl.viewport(0, 0, S.W, S.H);
  gl.clearBufferfv(gl.COLOR, 0, [0, 0, 0, 0]); gl.clearBufferfv(gl.COLOR, 1, [1e6, 0, 0, 0]); gl.clearBufferfv(gl.DEPTH, 0, [1]);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LESS);
  if (!imageMode){
    use(PR.terrain, {uViewProj: VP, uOct: 9});
    gl.bindVertexArray(R.terrainVAO); gl.drawElements(gl.TRIANGLES, R.terrainCount, gl.UNSIGNED_INT, 0);
  }

  // ---- trees: one instanced draw, one tree per 28 m cell, low-poly mesh at every distance ----
  if (!imageMode && P.trees && P.forest > 0){
    use(PR.tree, {uViewProj: VP, uN: treeN, uBase: [Math.floor(eye[0] / treeCS), Math.floor(eye[2] / treeCS)], uRows: R.treeMid.rows, uSegs: R.treeMid.seg});
    // the lattice winds clockwise seen from outside the tree, so CW = front face
    gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK); gl.frontFace(gl.CW);
    gl.bindVertexArray(R.treeMid.vao);
    gl.drawElementsInstanced(gl.TRIANGLES, R.treeMid.count, gl.UNSIGNED_SHORT, 0, treeN * treeN);
    gl.frontFace(gl.CCW); gl.disable(gl.CULL_FACE);
  }
  gl.disable(gl.DEPTH_TEST);

  // ---- volumetrics (low res) ----
  fullscreen(PR.vol, R.cur.fb, S.low[0], S.low[1], {
    uSceneDepth: R.tDepth, uLowSize: S.low, uFullSize: [S.W, S.H], uFrame: frame,
    // at night the sky-light floor x auto-exposure makes clouds glow; fade their ambient so they read as dark shapes
    uShafts: P.shafts, uCloudFar: 180, uAmbient: P.ambient * (0.25 + 0.75 * smooth(-0.21, 0.0, L[1]) + 0.55 * Sky.moonLight() * (1 - smooth(-0.21, 0.0, L[1]))), uSharp: P.sharp, uCrease: P.crease,
    uCloudSteps: q.cloud, uLightSteps: q.light, uAtmoSteps: q.atmo,
  });

  // ---- temporal accumulation ----
  const hc = R.hist[frame & 1], hp = R.hist[(frame + 1) & 1];
  fullscreen(PR.temporal, hc.fb, S.low[0], S.low[1], {
    uCur0: R.cur.tex[0], uCur1: R.cur.tex[1], uCur2: R.cur.tex[2], uCur3: R.cur.tex[3],
    uHist0: hp.tex[0], uHist1: hp.tex[1], uHist2: hp.tex[2], uHist3: hp.tex[3],
    uPrevVP: prevVP, uPrevCamPos: prevEye, uLowSize: S.low, uPrevLowSize: S.prevLow, uAlloc: S.alloc, uReset: resetHistory ? 1 : 0,
  });
  resetHistory = false; S.prevLow = S.low.slice();

  // ---- composite ----
  fullscreen(PR.comp, R.compFB, S.W, S.H, {
    uTerrainColor: R.tColor, uSceneDepth: R.tDepth,
    uVol0: hc.tex[0], uVol1: hc.tex[1], uVol2: hc.tex[2], uVol3: hc.tex[3], uLowSize: S.low,
  });

  // ---- bloom ----
  let src = R.comp, sw = S.W, sh = S.H;
  for (let i = 0; i < R.bloom.length; i++){
    const b = R.bloom[i];
    fullscreen(PR.bdown, b.fb, b.w, b.h, {uSrc: src, uSrcTexel: [1 / sw, 1 / sh], uFirst: i === 0 ? 1 : 0});
    src = b.tex; sw = b.w; sh = b.h;
  }
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  for (let i = R.bloom.length - 2; i >= 0; i--){
    const s = R.bloom[i + 1], d = R.bloom[i];
    fullscreen(PR.bup, d.fb, d.w, d.h, {uSrc: s.tex, uSrcTexel: [1 / s.w, 1 / s.h]});
  }
  gl.disable(gl.BLEND);

  // ---- final lens pass ----
  // project the sun direction (w = 0) to find it on screen
  const cl = [VP[0]*L[0] + VP[4]*L[1] + VP[8]*L[2], VP[1]*L[0] + VP[5]*L[1] + VP[9]*L[2], 0, VP[3]*L[0] + VP[7]*L[1] + VP[11]*L[2]];
  const sunScreen = cl[3] > 0 ? [cl[0] / cl[3] * 0.5 + 0.5, cl[1] / cl[3] * 0.5 + 0.5, 1] : [0, 0, 0];
  fullscreen(PR.final, null, S.W, S.H, {
    uComp: R.comp, uBloom: R.bloom[0].tex, uVol0: hc.tex[0], uSceneDepth: R.tDepth,
    // image mode: no lens distortion / vignette, so the sky stays aligned with the photo
    uRes: [S.W, S.H], uLowSize: S.low, uAspect: aspect, uDistort: imageMode ? 0 : P.distort, uCA: imageMode ? 0 : P.ca, uVignette: imageMode ? 0 : P.vignette,
    uContrast: P.contrast, uSharpen: P.sharpen, uBloomI: P.bloom * 0.12, uFlare: P.flare, uEV: P.ev + Fx.flashEV, uLetterbox: P.letterbox ? 1 : 0,
    uFrame: frame, uSunScreen: sunScreen,
  });

  gpuTimerEnd(gpuQ);
  Bg.frame(L, Weather.overcast(), Sky.moonLight());
  prevVP = VP; prevEye = eye.slice(); frame++;
  if (now - statsT > 500){
    fpsShown = 1000 / avg; statsT = now;
    const gtxt = useGpu ? ` · gpu ${gavg.toFixed(1)}ms` : (tq ? '' : ' · no gpu timer');
    document.getElementById('stats').textContent = `${fpsShown.toFixed(0)} fps${gtxt} · vol ${S.low[0]}×${S.low[1]}`;
  }
  requestAnimationFrame(render);
}

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

// ---- cloud cover calibration ------------------------------------------------------
// The renderer's "coverage" knob is not a sky fraction. These tables were measured by rendering the sky
// straight overhead at many positions and counting pixels where clouds block >50% of the light
// (tools/calibrate.js). Each row: [sky fraction, coverage knob] for a cloud type.
const COVER_CAL = {
  stratus: [[0, 0.28], [0.003, 0.3], [0.008, 0.325], [0.019, 0.35], [0.036, 0.375], [0.061, 0.4], [0.1, 0.425], [0.156, 0.45], [0.231, 0.475], [0.32, 0.5], [0.42, 0.525], [0.527, 0.55], [0.63, 0.575], [0.72, 0.6], [0.793, 0.625], [0.853, 0.65], [0.898, 0.675], [0.933, 0.7], [0.957, 0.725], [0.973, 0.75], [0.986, 0.775], [0.993, 0.8], [1, 0.85]],
  cumulus: [[0, 0.28], [0.002, 0.3], [0.008, 0.325], [0.021, 0.35], [0.042, 0.375], [0.071, 0.4], [0.116, 0.425], [0.18, 0.45], [0.261, 0.475], [0.355, 0.5], [0.455, 0.525], [0.56, 0.55], [0.66, 0.575], [0.749, 0.6], [0.818, 0.625], [0.872, 0.65], [0.913, 0.675], [0.943, 0.7], [0.963, 0.725], [0.977, 0.75], [0.988, 0.775], [0.996, 0.8], [1, 0.85]],
};
function coverFromFraction(f, type){
  f = clamp(f, 0, 1);
  const lookup = tab => {
    if (f <= tab[0][0]) return tab[0][1];
    for (let i = 1; i < tab.length; i++){
      if (f <= tab[i][0]){ const [f0, c0] = tab[i - 1], [f1, c1] = tab[i]; return c0 + (c1 - c0) * (f - f0) / Math.max(1e-6, f1 - f0); }
    }
    return tab[tab.length - 1][1];
  };
  const t = clamp((type - 0.2) / 0.6, 0, 1);   // blend between the two measured types
  return lookup(COVER_CAL.stratus) * (1 - t) + lookup(COVER_CAL.cumulus) * t;
}

// ---- solar position (NOAA-style low-precision formulae, ~0.1°) ---------------------
function solarPosition(date, lat, lon){
  const rad = Math.PI / 180;
  const d = date.getTime() / 864e5 - 10957.5;                 // days since J2000.0
  const g = (357.529 + 0.98560028 * d) * rad;                 // mean anomaly
  const q = 280.459 + 0.98564736 * d;                         // mean longitude
  const Ls = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * rad;
  const e = (23.439 - 0.00000036 * d) * rad;                  // obliquity
  const ra = Math.atan2(Math.cos(e) * Math.sin(Ls), Math.cos(Ls));
  const dec = Math.asin(Math.sin(e) * Math.sin(Ls));
  const gmst = ((18.697374558 + 24.06570982441908 * d) % 24 + 24) % 24;
  const H = (gmst * 15 + lon) * rad - ra;                      // hour angle
  const phi = lat * rad;
  const el = Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H));
  const az = Math.atan2(-Math.sin(H), Math.tan(dec) * Math.cos(phi) - Math.sin(phi) * Math.cos(H));
  let elDeg = el / rad;
  if (elDeg > -1) elDeg += 1.02 / Math.tan((elDeg + 10.3 / (elDeg + 5.11)) * rad) / 60;   // refraction near the horizon
  return {el: elDeg, az: ((az / rad) % 360 + 360) % 360};
}

// ---- WMO weather codes -------------------------------------------------------------
const WMO = {0:'Clear', 1:'Mainly clear', 2:'Partly cloudy', 3:'Overcast', 45:'Fog', 48:'Freezing fog',
  51:'Light drizzle', 53:'Drizzle', 55:'Heavy drizzle', 56:'Freezing drizzle', 57:'Freezing drizzle',
  61:'Light rain', 63:'Rain', 65:'Heavy rain', 66:'Freezing rain', 67:'Freezing rain',
  71:'Light snow', 73:'Snow', 75:'Heavy snow', 77:'Snow grains',
  80:'Rain showers', 81:'Rain showers', 82:'Violent showers', 85:'Snow showers', 86:'Heavy snow showers',
  95:'Thunderstorm', 96:'Thunderstorm, hail', 99:'Thunderstorm, hail'};
const RAIN_I = {51:.15, 53:.25, 55:.35, 56:.2, 57:.3, 61:.35, 63:.6, 65:1, 66:.4, 67:.8, 80:.4, 81:.7, 82:1, 95:.8, 96:.9, 99:1};
const SNOW_I = {71:.3, 73:.6, 75:1, 77:.25, 85:.5, 86:1};

// turn Open-Meteo "current" conditions into renderer settings
function mapWeather(c){
  const num = (v, d) => (typeof v === 'number' && isFinite(v)) ? v : d;
  const tot = clamp(num(c.cloud_cover, 0) / 100, 0, 1);
  const low = num(c.cloud_cover_low, tot * 100) / 100, mid = num(c.cloud_cover_mid, 0) / 100, high = num(c.cloud_cover_high, 0) / 100;
  const code = num(c.weather_code, 0);
  const T = c.temperature_2m, Td = c.dew_point_2m;
  // lifting condensation level: ~125 m per °C of dew-point depression -> cumulus base height
  const lcl = (typeof T === 'number' && typeof Td === 'number') ? clamp(0.125 * (T - Td), 0.4, 3.0) : 1.2;
  const thunder = code >= 95, showers = [80, 81, 82, 85, 86].includes(code);
  const steady = (code >= 51 && code <= 67) || (code >= 71 && code <= 77), fog = code === 45 || code === 48;
  let t, kind;
  if (thunder)      { kind = 'cumulonimbus'; t = {ctype: 1.0, cbottom: lcl, cthick: 6.0, density: 0.5, erosion: 0.4}; }
  else if (showers) { kind = 'towering cumulus'; t = {ctype: 0.9, cbottom: lcl, cthick: 4.0, density: 0.38, erosion: 0.45}; }
  else if (steady || fog || (tot > 0.85 && low >= mid))
                    { kind = steady ? 'nimbostratus' : 'stratus'; t = {ctype: 0.08, cbottom: Math.min(lcl, 1.0), cthick: steady ? 2.6 : 1.6, density: steady ? 0.5 : 0.35, erosion: 0.3}; }
  else if (high > 0.15 && high >= low && high >= mid)
                    { kind = 'high thin cloud'; t = {ctype: 0.22, cbottom: 6.0, cthick: 0.8, density: 0.07, erosion: 0.75}; }
  else if (mid > low){ kind = 'altocumulus'; t = {ctype: 0.45, cbottom: 3.0, cthick: 1.4, density: 0.2, erosion: 0.55}; }
  else if (c.is_day !== 0 && tot < 0.75)
                    { kind = 'cumulus'; t = {ctype: 0.85, cbottom: clamp(lcl, 0.8, 2.5), cthick: 1.2 + 2.2 * tot, density: 0.19, erosion: 0.45}; }
  else              { kind = 'stratocumulus'; t = {ctype: 0.5, cbottom: clamp(lcl, 0.6, 2.0), cthick: 1.0 + tot, density: 0.26, erosion: 0.45}; }
  t.kind = kind;
  t.frac = tot;
  t.coverage = coverFromFraction(tot, t.ctype);
  const vis = num(c.visibility, 24000);
  t.haze = clamp(0.45 + 0.3 * 20000 / Math.max(vis, 50), 0.45, 4.5);
  if (fog) t.haze = Math.max(t.haze, 3.5);
  t.wind = clamp(num(c.wind_speed_10m, 3) * 1.8, 2, 60);        // cloud-level wind is ~2x the 10 m wind
  t.windTo = (num(c.wind_direction_10m, 270) + 180) % 360;      // meteorological "from" -> "toward"
  const rainMM = num(c.rain, 0) + num(c.showers, 0), snowCM = num(c.snowfall, 0);
  t.rain = Math.max(RAIN_I[code] || 0, clamp(rainMM * 0.4, 0, 1));
  t.snow = Math.max(SNOW_I[code] || 0, clamp(snowCM * 0.8, 0, 1));
  if (t.snow > 0 && !(code in RAIN_I)) t.rain = Math.min(t.rain, 0.1);
  t.drizzle = code >= 51 && code <= 57;
  t.thunder = thunder;
  return t;
}

// ---- weather service -----------------------------------------------------------------
const Weather = (() => {
  const W = {loc: null, cur: null, at: 0, err: '', fails: 0, target: null, snap: true, windTo: null, frac: 0.4, sunT: 0, sunC: null, timer: 0, busy: false, again: false, uiT: 0};
  const FULL = 'temperature_2m,dew_point_2m,is_day,precipitation,rain,showers,snowfall,weather_code,cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,visibility,wind_speed_10m,wind_direction_10m';
  const MINI = 'temperature_2m,is_day,precipitation,weather_code,cloud_cover,wind_speed_10m,wind_direction_10m';
  async function getJSON(url, ms = 30000){
    const ac = new AbortController(), to = setTimeout(() => ac.abort(), ms);
    try {
      const r = await fetch(url, {signal: ac.signal, cache: 'no-store'});
      if (!r.ok){ const e = new Error(`HTTP ${r.status} from ${new URL(url).host}`); e.status = r.status; throw e; }
      return await r.json();
    } catch (e){ if (e.name === 'AbortError') throw new Error(`timed out reaching ${new URL(url).host}`); throw e; }
    finally { clearTimeout(to); }
  }
  async function resolveLocation(force){
    const q = (P.location || '').trim();
    const m = q.match(/^(-?\d+(?:\.\d+)?)\s*[,\s]\s*(-?\d+(?:\.\d+)?)$/);
    if (m && Math.abs(+m[1]) <= 90 && Math.abs(+m[2]) <= 180) return {lat: +m[1], lon: +m[2], name: `${(+m[1]).toFixed(2)}, ${(+m[2]).toFixed(2)}`};
    const cache = lsGet('wcs.loc');
    if (!force && cache && cache.q === q && Date.now() - cache.t < (q ? 30 : 1) * 864e5) return cache.loc;
    let loc;
    if (q){
      const parts = q.split(',').map(x => x.trim()).filter(Boolean);
      const j = await getJSON(`https://geocoding-api.open-meteo.com/v1/search?count=10&language=en&format=json&name=${encodeURIComponent(parts[0])}`);
      const res = j.results || [];
      if (!res.length) throw new Error(`couldn't find "${q}" — try "City, Country" or "lat, lon"`);
      // "Springfield, IL" / "Perth, Australia": prefer results whose region/country match the extra words
      const hints = parts.slice(1).map(x => x.toLowerCase());
      const score = r => hints.filter(h => [r.country, r.country_code, r.admin1, r.admin2].some(x => x && (x.toLowerCase() === h || x.toLowerCase().startsWith(h)))).length;
      const best = res.reduce((a, r) => score(r) > score(a) ? r : a, res[0]);
      loc = {lat: best.latitude, lon: best.longitude, name: [best.name, best.admin1, best.country_code].filter(Boolean).join(', ')};
    } else {
      // no location typed: approximate it from the public IP address (city-level at best; VPNs move it)
      let j;
      try { j = await getJSON('https://get.geojs.io/v1/ip/geo.json'); }
      catch (e){ j = await getJSON('https://ipapi.co/json/'); }
      loc = {lat: parseFloat(j.latitude), lon: parseFloat(j.longitude), name: [j.city, j.region].filter(Boolean).join(', ') + ' (from IP)'};
      if (!isFinite(loc.lat) || !isFinite(loc.lon)) throw new Error('could not detect your location — type your city in Location');
    }
    lsSet('wcs.loc', {q, t: Date.now(), loc});
    return loc;
  }
  async function fetchCurrent(loc){
    const base = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat.toFixed(4)}&longitude=${loc.lon.toFixed(4)}&wind_speed_unit=ms&timezone=auto&current=`;
    try { return (await getJSON(base + FULL)).current; }
    catch (e){ if (e.status === 400) return (await getJSON(base + MINI)).current; throw e; }   // a field was rejected: retry with the basics
  }
  function accept(loc, cur, at, snap){
    W.loc = loc; W.cur = cur; W.at = at;
    W.target = mapWeather(cur);
    if (snap) W.snap = true;
  }
  async function refresh(force){
    clearTimeout(W.timer);
    if (!P.liveWeather){ readout(); return; }
    if (W.busy){ W.again = true; return; }
    W.busy = true; readout();
    try {
      const loc = await resolveLocation(force === true);
      const cur = await fetchCurrent(loc);
      if (!cur) throw new Error('no current conditions in the response');
      const locChanged = !W.loc || Math.abs(W.loc.lat - loc.lat) + Math.abs(W.loc.lon - loc.lon) > 0.5;
      accept(loc, cur, Date.now(), locChanged);

    } catch (e){

    const c = lsGet('wcs.wx');

    if (now - W.uiT > 1000){                                // keep the advanced panel's sliders in step
      W.uiT = now;
      if (document.getElementById('ui').style.display !== 'none') for (const id of IDS.concat(['coverage'])) setSlider(id, P[id]);

    W.renderedAt = Date.now();

    const line = (cls, text) => { const d = document.createElement('div'); if (cls) d.className = cls; d.textContent = text; box.appendChild(d); };

    else if (W.cur){
      const c = W.cur, ago = Math.round((Date.now() - W.at) / 60000);
      if (P.showWx){
        line('big', `${typeof c.temperature_2m === 'number' ? fmtTemp(c.temperature_2m) : ''}  ${WMO[c.weather_code] || ''}`);
        line('', `☁ ${Math.round(c.cloud_cover)}% cloud cover · wind ${fmtWind(c.wind_speed_10m || 0)} ${compass(c.wind_direction_10m || 0)}`);
        line('dim', `${W.loc ? W.loc.name : ''} · ${ago < 1 ? 'just updated' : `updated ${ago} min ago`}${W.err ? ' · offline, retrying' : ''}`);
      }
      note = `${W.loc ? W.loc.name : ''}: ${Math.round(c.cloud_cover)}% cover (low ${c.cloud_cover_low ?? '?'} / mid ${c.cloud_cover_mid ?? '?'} / high ${c.cloud_cover_high ?? '?'}) → ${W.target.kind}` + (W.err ? `\nLast update failed: ${W.err}` : '');

})();

// ---- background image: foreground photo over the rendered sky --------------------------
const Bg = (() => {
  const cv = document.getElementById('fg'), ctx = cv.getContext('2d');
  const B = {img: null, url: '', name: '', err: '', w: 0, h: 0, alphaSky: null, autoSky: null, hasAlpha: false, tainted: false,

    const id = ++B.loadId;
    B.err = '';
    if (!src){ B.img = null; rebuild(); return; }
    if (src === 'idb:'){

        if (id !== B.loadId) return;
        if (blob) loadURL(URL.createObjectURL(blob), blob.name || 'chosen image', id);
        else { B.img = null; B.err = 'The image chosen earlier is no longer stored — choose it again.'; rebuild(); }

      analyse(); rebuild(); resetHistory = true;

// ---- rain / snow / lightning overlay ------------------------------------------------------
const Fx = (() => {

  function step(dt){
    const t = P.precip ? Weather.precip() : null;
    if (!t || (t.rain <= 0 && t.snow <= 0 && !t.thunder)){
      if (drawn){ ctx.clearRect(0, 0, W, H); drawn = false; drops.length = flakes.length = 0; }
      F.flashEV = 0; flashEl.style.opacity = 0; return;
    }
    const area = (W * H) / (1920 * 1080 * sc * sc);
    const nR = Math.round(t.rain * (t.drizzle ? 900 : 550) * area), nS = Math.round(t.snow * 420 * area);
    while (drops.length < nR) drops.push(newDrop(false)); drops.length = nR;
    while (flakes.length < nS) flakes.push(newDrop(false)); flakes.length = nS;
    ctx.clearRect(0, 0, W, H); drawn = true;
    if (nR){
      const v = (t.drizzle ? 700 : 1300) * sc, len = (t.drizzle ? 7 : 22) * sc, wx = t.windX * 0.45;
      ctx.strokeStyle = 'rgba(205,215,230,0.32)'; ctx.lineWidth = (t.drizzle ? 0.8 : 1.1) * sc; ctx.lineCap = 'round';

        ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - wx * len * d.z, d.y - len * d.z);
      }
      ctx.stroke();
    }
    if (nS){
      const now = performance.now() / 1000;
      ctx.fillStyle = 'rgba(245,248,255,0.8)';
      ctx.beginPath();

        f.y += 70 * sc * f.z * dt; f.x += (Math.sin(now * 1.3 + f.z * 40) * 18 + t.windX * 60) * sc * f.z * dt;

})();

    const alt2 = alt - par * Math.cos(alt), hz = Math.hypot(md[0], md[2]) || 1;
    md = [md[0] / hz * Math.cos(alt2), Math.sin(alt2), md[2] / hz * Math.cos(alt2)];
    const ncp = toWorld([0, 0, 1]);                                     // celestial north, for the Moon's orientation
    let up = v3.sub(ncp, v3.scale(md, v3.dot(ncp, md))); up = v3.dot(up, up) > 1e-8 ? v3.norm(up) : [0, 1, 0];
    const radius = Math.asin(1737.4 / (b.moon.dist * 6378.14)) * P.moonScale;
    const day = smooth(-0.21, 0.0, L[1]);
    K.moonLight = Math.pow(b.moon.illum, 1.5) * smooth(-1 * DEG, 12 * DEG, alt2);
    const glow = 0.0022 * K.moonLight * (1 - day);
    // a moonlit sky hides faint stars
    const limit = LIMIT[P.skyDark] - 1.6 * K.moonLight;
    const ma = 0.006 * K.moonLight * (1 - day) * (1 - 0.7 * Weather.overcast());   // clouds dim it
    return {uMoonAmb: [0.75 * ma, 0.85 * ma, 1.0 * ma], uStarParams: [0.02 * P.starBright, limit, pixAng, 1], uJ2000FromWorld: W2J, uStarBins: T.bins, uStarIdx: T.idx, uStarData: T.data,
      uMoonDir: md, uMoonUp: up, uMoonParams: [radius, 1.56e-6 * (0.13 + 2.37 * day), 0.004, 1], uMoonGlow: [0.55 * glow, 0.68 * glow, 1.0 * glow]};
  }
  return {update, moonLight: () => K.moonLight, active: () => K.active, state: K, rebuild: () => { K.key = ''; }};
})();

// ---- hosts: Lively Wallpaper, Wallpaper Engine, URL parameters, saved browser settings -------
let hostSeen = false, bootT = 0;
function applyExternal(name, val){
  hostSeen = true;
  const id = SCHEMA.find(s => s.id && s.id.toLowerCase() === String(name).toLowerCase());
  if (name === 'showPanel' || name === 'showpanel') return togglePanel(val === true || val === 'true' || val === 1);
  if (!id) return;
  if (id.type === 'button'){ if (booted && performance.now() - bootT > 4000) id.on(); return; }   // hosts may 'press' buttons at load
  setParam(id.id, val);
}
// Lively: called once per property at load, then on every change in the Customise panel
window.livelyPropertyListener = (name, val) => applyExternal(name, val);
// Wallpaper Engine (web wallpaper): untested, mirrors the same property names
window.wallpaperPropertyListener = {
  applyUserProperties(props){ for (const k in props) if (props[k] && 'value' in props[k]) applyExternal(k, props[k].value); },
};
(function loadSaved(){
  const saved = lsGet('wcs.settings');
  if (saved) for (const k in saved) if (PERSIST.has(k)) setParam(k, saved[k]);
  const qs = new URLSearchParams(window.location.search);
  for (const [k, v] of qs){ if (k === 'panel') togglePanel(v !== '0'); else setParam(k, v); }
})();
function boot(){
  booted = true; bootT = performance.now();
  canvas.classList.toggle('interactive', P.interactive);
  if (P.bgMode === 'Image' || P.bgImage) Bg.load(P.bgImage);
  Weather.init();
  addEventListener('resize', () => Bg.rebuild());
  // in a plain browser (no wallpaper host has called us), point at the settings panel once
  setTimeout(() => {
    if (hostSeen || document.getElementById('ui').style.display !== 'none') return;
    const h = document.createElement('div');
    h.textContent = 'Press H for settings';
    h.style.cssText = 'position:fixed;left:16px;bottom:14px;color:#fff;opacity:.75;font-size:12px;text-shadow:0 1px 3px #000;transition:opacity 1s;pointer-events:none';
    document.body.appendChild(h);
    setTimeout(() => { h.style.opacity = 0; setTimeout(() => h.remove(), 1200); }, 7000);
  }, 1500);
}
// debug / calibration hook
window.__wcs = {P, setParam, Weather, Bg, Fx, mapWeather, solarPosition, coverFromFraction, get frame(){ return frame; },
  readCloudT(){
    const h = R.hist[(frame + 1) & 1], w = S.low[0], hh = S.low[1], buf = new Float32Array(w * hh * 4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, h.fb); gl.readBuffer(gl.COLOR_ATTACHMENT0);
    gl.readPixels(0, 0, w, hh, gl.RGBA, gl.FLOAT, buf);
    const a = new Float32Array(w * hh); for (let i = 0; i < a.length; i++) a[i] = buf[i * 4 + 3];
    return {w, h: hh, T: Array.from(a)};
  }};

setTimeout(() => {
  boot();          // start the network requests before the (blocking) GPU set-up
  initStatic();
  allocFull();
  msgEl.style.display = 'none';
  requestAnimationFrame(t => { lastT = t - 1000; render(t); });
}, 30);
</script>
